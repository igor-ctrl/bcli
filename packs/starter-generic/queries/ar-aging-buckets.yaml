queries:
  ar-aging-buckets:
    description: Aged accounts receivable summary; param "as_of" controls the cutoff date
    endpoint: agedAccountsReceivables
    params:
      as_of:
        default: "today"
        type: string
        description: Cutoff date YYYY-MM-DD or 'today'
      limit:
        default: 100
        type: integer
        min: 1
        max: 5000
    select: "customerNumber,name,currencyCode,balanceDue,currentAmount,period1Amount,period2Amount,period3Amount"
    orderby: "balanceDue desc"
    top: "${{ params.limit }}"
