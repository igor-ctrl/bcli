name: "AP Monthly Review — March 2026"
# Run: bcli batch run examples/ap-monthly-review.yaml
# Dry run first: bcli batch run examples/ap-monthly-review.yaml --dry-run

steps:
  - name: Open Purchase Invoices
    action: get
    endpoint: purchaseInvoices
    params:
      filter: "status eq 'Open'"
      select: "number,vendorNumber,vendorName,invoiceDate,dueDate,totalAmountIncludingTax"
      orderby: "dueDate asc"

  - name: Aged Payables
    action: get
    endpoint: agedAccountsPayables
    params:
      select: "vendorNumber,name,currencyCode,balanceDue,currentAmount,period1Amount,period2Amount,period3Amount"
      orderby: "balanceDue desc"

  - name: GL Entries (March)
    action: get
    endpoint: generalLedgerEntries
    params:
      filter: "postingDate ge 2026-03-01 and postingDate le 2026-03-31"
      select: "entryNumber,postingDate,documentNumber,accountNumber,description,debitAmount,creditAmount"
      top: "50"
      orderby: "postingDate desc"

  - name: Overdue Invoices
    action: get
    endpoint: purchaseInvoices
    params:
      filter: "status eq 'Open' and dueDate lt 2026-03-31"
      select: "number,vendorNumber,vendorName,dueDate,totalAmountIncludingTax"
      orderby: "dueDate asc"
