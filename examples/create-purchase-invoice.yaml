name: "Create Draft Purchase Invoice"
# Uses the standard v2.0 purchaseInvoices / purchaseInvoiceLines entities.
#
# Run: bcli batch run examples/create-purchase-invoice.yaml --set vendor_no=V00011 --set gl_account=<G/L account no.>
# Dry run: add --dry-run
#
# Step chaining: the invoice id from step 1 flows into steps 2 and 3
# via ${{ steps.create_header.id }}.

params:
  vendor_no:
    description: "Vendor number (e.g. V00011)"
    required: true
  gl_account:
    description: "G/L account number to expense the lines to"
    required: true
  vendor_invoice_no:
    description: "Vendor's own invoice number"
    default: "INV-2026-0315"
  service_desc:
    description: "Description for the service line"
    default: "Implementation consulting — 30 hours"
  service_cost:
    description: "Service fee"
    default: 4500
  travel_cost:
    description: "Travel expenses"
    default: 1200

steps:
  # 1. Create the invoice header
  - name: create_header
    action: post
    endpoint: purchaseInvoices
    data:
      vendorNumber: "${{ params.vendor_no }}"
      vendorInvoiceNumber: "${{ params.vendor_invoice_no }}"

  # 2. Add first line (service fee)
  - name: add_service_line
    action: post
    endpoint: purchaseInvoiceLines
    data:
      documentId: "${{ steps.create_header.id }}"
      lineType: "Account"
      lineObjectNumber: "${{ params.gl_account }}"
      description: "${{ params.service_desc }}"
      quantity: 1
      directUnitCost: ${{ params.service_cost }}

  # 3. Add second line (travel expenses)
  - name: add_travel_line
    action: post
    endpoint: purchaseInvoiceLines
    data:
      documentId: "${{ steps.create_header.id }}"
      lineType: "Account"
      lineObjectNumber: "${{ params.gl_account }}"
      description: "Travel and per diem"
      quantity: 1
      directUnitCost: ${{ params.travel_cost }}
