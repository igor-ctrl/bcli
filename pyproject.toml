[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bcapi"
version = "0.1.0"
description = "Python SDK and CLI for Microsoft Dynamics 365 Business Central APIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Igor", email = "igor@acme.com" }]
keywords = ["business-central", "dynamics-365", "odata", "cli", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "msal>=1.28",
    "typer[all]>=0.12",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.scripts]
bcli = "bcapi_cli.app:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bcapi", "src/bcapi_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 100
