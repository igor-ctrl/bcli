[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI. Note: an unrelated 2018-vintage package named
# `bcli` ("EC2 Cluster Creator") squats on that name on PyPI, so we publish
# under `bc-cli` instead. The Python import name (`import bcli`) and the
# installed CLI binary (`bcli`) are unaffected — only `pip install` /
# `uv tool install` use this name.
name = "bc-cli"
version = "0.6.1"
description = "Python SDK and CLI for Microsoft Dynamics 365 Business Central APIs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Igor" }]
keywords = ["business-central", "dynamics-365", "odata", "cli", "sdk", "etl", "dlt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "httpx>=0.27",
    "keyring>=25.0",
    "msal>=1.28",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "tomlkit>=0.13",
]

[project.urls]
Homepage = "https://github.com/igor-ctrl/bcli"
Repository = "https://github.com/igor-ctrl/bcli"
Issues = "https://github.com/igor-ctrl/bcli/issues"
Documentation = "https://github.com/igor-ctrl/bcli/tree/main/docs"

[project.scripts]
bcli = "bcli_cli.app:main"
bcli-mcp = "bcli_mcp:main"

[project.optional-dependencies]
# Backward-compatible no-op extra for existing install commands.
cli = []
etl = [
    "dlt[parquet,filesystem,s3]>=1.0",
]
telemetry = [
    "azure-monitor-opentelemetry>=1.6",
]
extract = [
    "bc-cli[extract-claude]",
    "bc-cli[extract-openai]",
]
extract-claude = [
    "anthropic>=0.40",
    "pypdf>=4.0",
]
extract-openai = [
    "openai>=1.50",
    "pypdf>=4.0",
]
ask = [
    "bc-cli[ask-claude]",
    "bc-cli[ask-openai]",
]
ask-claude = [
    "anthropic>=0.40",
]
ask-openai = [
    "openai>=1.50",
]
mcp = [
    "mcp>=1.0",
]
# Agent mode (the interactive chat REPL + headless `bcli agent run`).
# Three backends, each behind its own extra; `agent` is the meta-extra
# that installs the BYOK loop + the Textual TUI. The harness-owned
# backends (claude-code / codex) are additive opt-ins.
agent-local = [
    "pydantic-ai-slim[anthropic,openai]>=1.107,<2",
]
agent-claude-code = [
    "claude-agent-sdk>=0.2",
]
agent-codex = [
    # openai-codex is in beta (0.1.x); allow prereleases so the pin
    # resolves. It pulls in its own openai-codex-cli-bin runtime.
    "openai-codex>=0.1.0b3",
]
agent = [
    "bc-cli[agent-local]",
    "textual>=8.2",
]
polaris = [
    "bc-cli[etl]",
    "pyarrow>=16.0",
    "pyiceberg[s3fs]>=0.7",
]
dev = [
    "bc-cli[etl]",
    "bc-cli[mcp]",
    "bc-cli[extract]",
    "bc-cli[ask]",
    "bc-cli[agent]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bcli", "src/bcli_cli", "src/bcli_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"packs" = "bcli/packs/_builtin"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "packs/",
    "tests/",
    "examples/",
    "docs/",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.uv]
# The optional [agent-codex] extra depends on openai-codex, which is
# beta-only and pulls a pinned prerelease runtime
# (openai-codex-cli-bin==0.137.0a4). Enabling prereleases lets the
# universal lock resolve that extra. Every other dependency has a stable
# release satisfying its constraint, so uv still pins stable versions for
# them — the lockfile records exact versions regardless.
prerelease = "allow"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 100
