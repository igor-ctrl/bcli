[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bcli"
version = "0.1.0"
description = "Python SDK and CLI for Microsoft Dynamics 365 Business Central APIs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Igor" }]
keywords = ["business-central", "dynamics-365", "odata", "cli", "sdk", "etl", "dlt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "httpx>=0.27",
    "msal>=1.28",
    "pydantic>=2.0",
    "tomlkit>=0.13",
]

[project.urls]
Homepage = "https://github.com/igor-ctrl/bcli"
Repository = "https://github.com/igor-ctrl/bcli"
Issues = "https://github.com/igor-ctrl/bcli/issues"
Documentation = "https://github.com/igor-ctrl/bcli/tree/main/docs"

[project.scripts]
bcli = "bcli_cli.app:app"

[project.optional-dependencies]
cli = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "workos>=5.0",
]
etl = [
    "dlt>=1.0",
]
dev = [
    "bcli[cli]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bcli", "src/bcli_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 100
